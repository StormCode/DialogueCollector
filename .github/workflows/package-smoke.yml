# Build the packaged app on every target and run the walking-skeleton check against the
# packaged artifact (not a dev build): sidecar spawns, one cue is cut, one row is written,
# the renderer loads the clip through the asset protocol.
name: package-smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same ref supersedes a run in progress (macOS minutes bill at 10x).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
          # x86_64 is cross-built on the arm64 runner and smoke-tested under Rosetta.
          - arch: x86_64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch }}-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Cache ffmpeg sidecar
        id: ffmpeg-cache
        uses: actions/cache@v6
        with:
          path: |
            src-tauri/binaries/ffmpeg-${{ matrix.arch }}-apple-darwin
            src-tauri/binaries/ffprobe-${{ matrix.arch }}-apple-darwin
          key: ffmpeg-${{ matrix.arch }}-apple-darwin-${{ hashFiles('scripts/ffmpeg/pins.json', 'scripts/ffmpeg/build-macos.sh') }}
      - name: Build LGPL ffmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          [ "${{ matrix.arch }}" = x86_64 ] && brew install nasm
          scripts/ffmpeg/build-macos.sh ${{ matrix.arch }}

      - run: npm ci
      - run: npm test
      - name: Package
        run: npm run tauri build -- --target ${{ matrix.arch }}-apple-darwin

      - name: Smoke test the packaged app
        run: |
          app="src-tauri/target/${{ matrix.arch }}-apple-darwin/release/bundle/macos/DialogueCollector.app"
          "$app/Contents/MacOS/dialogue-collector" --smoke --smoke-report smoke.txt
          cat smoke.txt

      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}
          path: src-tauri/target/${{ matrix.arch }}-apple-darwin/release/bundle/dmg/*.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Cache ffmpeg sidecar
        id: ffmpeg-cache
        uses: actions/cache@v6
        with:
          path: |
            src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe
            src-tauri/binaries/ffprobe-x86_64-pc-windows-msvc.exe
          key: ffmpeg-x86_64-pc-windows-msvc-${{ hashFiles('scripts/ffmpeg/pins.json', 'scripts/ffmpeg/build-windows.sh') }}
      - uses: msys2/setup-msys2@v2
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        with:
          msystem: UCRT64
          path-type: inherit
          install: >-
            mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-nasm mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-zlib mingw-w64-ucrt-x86_64-bzip2 make diffutils tar xz curl
      - name: Build LGPL ffmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: scripts/ffmpeg/build-windows.sh

      - run: npm ci
      - run: npm test
      # Windows-only paths (settings in Roaming, library in Local) are only exercised here.
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: NSIS template matches the installed Tauri CLI
        run: node scripts/nsis/check-template.mjs
      - name: Package
        run: npm run tauri build -- --bundles nsis

      - name: Install silently and smoke test the installed app
        shell: pwsh
        run: |
          Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Format-Table Name, Length
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          # No /D: exercise the default per-user location, which must not be the library folder.
          Start-Process $setup.FullName -ArgumentList "/S" -Wait
          $dir = Join-Path $env:LOCALAPPDATA "Programs\DialogueCollector"
          if (Test-Path (Join-Path $env:LOCALAPPDATA "DialogueCollector\uninstall.exe")) { throw "installed into the library folder" }
          $exe = Get-ChildItem $dir -Filter *.exe | Where-Object { $_.Name -notmatch '^(ffmpeg|ffprobe|uninstall)\.exe$' } | Select-Object -First 1
          if (-not $exe) { throw "no app executable in $dir" }
          # Shortcuts and Apps & Features carry the name in the installer's language (English here).
          $name = "Dialogue Collector"
          $startMenu = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\$name.lnk"
          $desktop = Join-Path ([Environment]::GetFolderPath("Desktop")) "$name.lnk"
          if (-not (Test-Path $startMenu)) { throw "no Start menu shortcut named $name" }
          if (-not (Test-Path $desktop)) { throw "no desktop shortcut named $name" }
          $key = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\DialogueCollector"
          $shown = (Get-ItemProperty $key).DisplayName
          if ($shown -ne $name) { throw "Apps & Features shows '$shown', not '$name'" }
          Get-ChildItem $dir | Format-Table Name, Length
          $report = Join-Path $env:RUNNER_TEMP "smoke.txt"
          # Release builds use the GUI subsystem, so stdout is not attached: read the report file.
          $p = Start-Process $exe.FullName -ArgumentList "--smoke", "--smoke-report", $report -Wait -PassThru
          Get-Content $report
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
          # First launch creates the default library; settings live apart from it.
          $library = Join-Path $env:LOCALAPPDATA "DialogueCollector"
          Get-ChildItem $library -Force | Format-Table Name, Length
          if (-not (Test-Path (Join-Path $library "library.sqlite"))) { throw "first launch did not create the default library" }
          if (Test-Path (Join-Path $library "settings.json")) { throw "settings.json written into the library folder" }
          if (-not (Test-Path (Join-Path $env:APPDATA "DialogueCollector\settings.json"))) { throw "settings.json missing from Roaming AppData" }
          # Update over a running app, as the updater does: the installer must wait for the app to
          # let go of its exe (or end it) instead of stopping on "can't open file for writing".
          $running = Start-Process $exe.FullName -PassThru
          Start-Sleep -Seconds 3
          if ($running.HasExited) { throw "the app quit before the update started" }
          $update = Start-Process $setup.FullName -ArgumentList "/S", "/UPDATE" -Wait -PassThru
          if ($update.ExitCode -ne 0) { throw "updating over the running app failed ($($update.ExitCode))" }
          if (-not $running.HasExited) { throw "the app is still running after the update" }

      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
