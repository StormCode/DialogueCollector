[package]
name = "dialogue-collector"
version = "0.1.0"
description = "台詞收藏家 — a character-organized library of dialogue clips"
authors = ["nerixori"]
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (cargo#8519, Windows).
name = "dialogue_collector_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
dirs = "6"
rand = "0.9"
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }
fs4 = "1"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_System_WindowsProgramming"] }

[dev-dependencies]
tempfile = "3"

# Keep SQLite optimized in dev and test builds so timings resemble release (T5 search budget).
[profile.dev.package.libsqlite3-sys]
opt-level = 3

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
