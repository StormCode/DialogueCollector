<script type="text/x-dc" data-dc-script data-props='{"showPosterPreview":{"editor":"boolean","default":false,"tsType":"boolean"},"$preview":{"width":1280,"height":800}}'>

  constructor(props) {

    this.PAGE_SIZE = 10;
    const texts = [
      '今天的風好舒服呢。',
      '等一下，我還沒說完！',

      '嗯……讓我再想一下。',
      '就算全世界都說不可能，我也要試試看。',

      '別擔心，交給我吧。',
      '這就是我的答案。',

      '我會一直記得今天的。',
      '準備好了嗎？要出發囉！',
      '對不起，是我錯了。',
      '只要還有明天，就還有希望。',
      '晚安，做個好夢。',
    ];
    const originals = ['今日の風、気持ちいいね。', 'ちょっと待って、まだ話は終わってない！', '何があっても、わたしはあなたの味方だよ。', 'この程度の困難なんて、どうってことない。', 'ありがとう、ずっとそばにいてくれて。', 'えっ？本当に？', 'あの時、もう少しだけ勇気を出せていたら……', '行こう、みんなが待ってる。', 'べ、別にあなたが心配で来たわけじゃないんだからね。', '約束だよ、明日同じ時間にここで会おう。', '今度は、わたしがあなたを守る番。', 'うーん……もう少し考えさせて。', '世界中が無理だって言っても、わたしはやってみる。', '久しぶり、全然変わってないね。', '心配しないで、わたしに任せて。', 'これが、わたしの答え。', 'バカ、いったい何考えてるのよ！', '雨だね、一緒に傘に入って帰ろう。', '今日のこと、ずっと覚えてるから。', '準備はいい？出発するよ！', 'ごめんなさい、わたしが悪かった。', '明日がある限り、希望はある。', 'おやすみ、いい夢を。'];
    const base = new Date(2026, 8, 22, 21, 30).getTime();
    this.LINES = texts.map((text, i) => {
      const durationMs = 1800 + ((i * 1733) % 7200) + text.length * 60;
      return {
        id: i + 1,
        text: originals[i],
        translation: text,
        durationMs: Math.round(durationMs / 100) * 100,
        createdAt: base - i * (5 * 3600 * 1000 + ((i * 7919) % 3600) * 1000),
      };
    });
    this.timer = null;
  }

  componentWillUnmount() {
    this.stopTimer();
    if (this.state.posterUrl) {
      try { URL.revokeObjectURL(this.state.posterUrl); } catch (e) {}
    }
  }

  toggleExpand = () => this.setState({ expanded: !this.state.expanded });

  // ---------- poster ----------
  handlePosterFile = (e) => {
    const file = e && e.target && e.target.files && e.target.files[0];
    if (!file) return;
    if (this.state.posterUrl) {
      try { URL.revokeObjectURL(this.state.posterUrl); } catch (err) {}
    }
    this.setState({ posterUrl: URL.createObjectURL(file) });
    e.target.value = '';
  };

  removePoster = () => {
    if (this.state.posterUrl) {
      try { URL.revokeObjectURL(this.state.posterUrl); } catch (err) {}
    }
    this.setState({ posterUrl: null });
  };

  // ---------- search / sort ----------
  handleQueryChange = (e) => this.setState({ query: e.target.value, page: 1 });
  handleQueryClear = () => this.setState({ query: '', page: 1 });
  toggleSort = () => this.setState({ sortOpen: !this.state.sortOpen });

  pickSort = (key) => this.setState({ sortKey: key, page: 1, sortOpen: false });
  pickDir = (dir) => this.setState({ sortDir: dir, page: 1, sortOpen: false });

  getVisible = () => {
    const pinned = this.state.pinned || [];
    return this.getFiltered().filter((l) => !pinned.includes(l.id));
  };

  getPinned = () => {
    const pinned = this.state.pinned || [];
    return this.getFiltered().filter((l) => pinned.includes(l.id));
  };

  getOrdered = () => [...this.getPinned(), ...this.getVisible()];

  togglePin = (id) => {
    const cur = this.state.pinned || [];
    this.setState({ pinned: cur.includes(id) ? cur.filter((x) => x !== id) : [...cur, id] });
  };

  setEditMode = (on) => {
    const next = typeof on === 'boolean' ? on : !this.state.editMode;
    if (next) this.stopAll();
    this.setState({ editMode: next });
  };

  getFiltered = () => {
    const q = (this.state.query || '').trim();
    const list = q ? this.LINES.filter((l) => (l.text.includes(q) || l.translation.includes(q))) : this.LINES.slice();
    const key = this.state.sortKey === 'duration' ? 'durationMs' : 'createdAt';
    const dir = this.state.sortDir === 'asc' ? 1 : -1;
    list.sort((a, b) => (a[key] - b[key]) * dir);
    return list;
  };

  // ---------- checks ----------
  toggleCheck = (id) => {
    const cur = this.state.checked || [];
    this.setState({ checked: cur.includes(id) ? cur.filter((x) => x !== id) : [...cur, id] });
  };

  // ---------- playback (simulated) ----------
  stopTimer = () => {
    if (this.timer) { clearInterval(this.timer); this.timer = null; }
  };

  startTimer = () => {
    this.stopTimer();
    this.timer = setInterval(this.tick, 100);
  };

  tick = () => {
    const { queue, qIndex, progress, paused } = this.state;
    if (paused || !queue.length) return;
    const line = this.LINES.find((l) => l.id === queue[qIndex]);
    if (!line) { this.stopAll(); return; }
    const next = progress + 100 / line.durationMs;
    if (next < 1) { this.setState({ progress: next }); return; }
    if (qIndex + 1 < queue.length) {
      this.setState({ qIndex: qIndex + 1, progress: 0 });
      this.followPage(queue[qIndex + 1]);
    } else {
      this.stopAll();
    }
  };

  followPage = (id) => {
    const idx = this.getVisible().findIndex((l) => l.id === id);
    if (idx >= 0) this.setState({ page: Math.floor(idx / this.PAGE_SIZE) + 1 });
  };

  startQueue = (ids, mode) => {
    if (!ids.length) return;
    this.setState({ queue: ids, qIndex: 0, progress: 0, paused: false, mode });
    this.followPage(ids[0]);
    this.startTimer();
  };

  stopAll = () => {
    this.stopTimer();
    this.setState({ queue: [], qIndex: 0, progress: 0, paused: false, mode: null });
  };

  currentId = () => {
    const { queue, qIndex } = this.state;
    return queue.length ? queue[qIndex] : null;
  };

  togglePlay = (id) => {
    if (this.currentId() === id) {
      const paused = !this.state.paused;
      this.setState({ paused });
      if (!paused) this.startTimer();
      return;
    }
    this.startQueue([id], 'single');
  };

  toggleAll = () => {
    if (this.state.queue.length) { this.stopAll(); return; }
    this.startQueue(this.getOrdered().map((l) => l.id), 'all');
  };

  toggleSeq = () => {
    if (this.state.mode === 'seq') { this.stopAll(); return; }
    const checked = this.state.checked || [];
    this.startQueue(this.getOrdered().filter((l) => checked.includes(l.id)).map((l) => l.id), 'seq');
  };

  // ---------- pagination ----------
  totalPages = () => Math.max(1, Math.ceil(this.getVisible().length / this.PAGE_SIZE));
  goToPage = (n) => this.setState({ page: Math.min(Math.max(1, n), this.totalPages()) });

  goPrev = () => this.goToPage((this.state.page ?? 1) - 1);
  goNext = () => this.goToPage((this.state.page ?? 1) + 1);
  goLast = () => this.goToPage(this.totalPages());

  buildPageItems = (current, total) => {
    const nums = [1];
    for (let i = Math.max(2, current - 1); i <= Math.min(total - 1, current + 1); i++) nums.push(i);
    if (total > 1) nums.push(total);
    const items = [];
    let prev = 0;
    nums.forEach((n) => {
      if (n - prev > 1) items.push({ isEllipsis: true, isPage: false, label: '…' });

  };

  renderVals() {

    const visible = this.getVisible();
    const total = this.totalPages();

    const checked = this.state.checked || [];
    const curId = this.currentId();
    const paused = !!this.state.paused;

        text: l.text,
        translation: l.translation,
        durationLabel: this.fmtDuration(l.durationMs),
        createdLabel: this.fmtDate(l.createdAt),
        checked: checked.includes(l.id),
        toggleCheck: () => this.toggleCheck(l.id),

    const lines = visible.slice(start, start + this.PAGE_SIZE).map(buildItem);

    const sortKey = this.state.sortKey;

    const dirText = () => (sortDir === 'desc' ? '遞減' : '遞增');
    const dirOptions = [
      { dir: 'asc', label: '遞增', icon: 'arrow_upward' },

    ].map((o) => {

      isCompact: (this.state.view ?? 'compact') === 'compact',
      isDetail: this.state.view === 'detail',
      compactBtnClass: (this.state.view ?? 'compact') === 'compact' ? 'is-selected' : '',
      detailBtnClass: this.state.view === 'detail' ? 'is-selected' : '',
      viewClass: (this.state.view ?? 'compact') === 'compact' ? 'is-compact' : '',
      setCompact: () => this.setState({ view: 'compact' }),
      setDetail: () => this.setState({ view: 'detail' }),
      sortOpen: !!this.state.sortOpen,
      toggleSort: this.toggleSort,
      sortBtnClass: this.state.sortOpen ? 'is-active' : '',
      sortOptions,
      dirOptions,
      sortSummary: (sortKey === 'duration' ? '時長 ' : '建立時間 ') + dirText(),
      totalCount: visible.length + pinnedList.length,
      hasPinned: pinnedList.length > 0,
      pinnedCount: pinnedList.length,
      pinnedLines,
      pinExpanded: !this.state.pinCollapsed,
      pinHeadClass: this.state.pinCollapsed ? 'is-collapsed' : '',
      togglePinCollapsed: () => this.setState({ pinCollapsed: !this.state.pinCollapsed }),
      editMode,
      setEditMode: this.setEditMode,

      lines,
      listClass: checked.length ? 'has-checked' : '',
      isEmpty: visible.length === 0 && pinnedList.length === 0,
      showPagination: !(visible.length === 0 && pinnedList.length === 0),
      pageItems: this.buildPageItems(page, total),
      isFirstPage: page <= 1,
      isLastPage: page >= total,
      goFirst: this.goFirst,
      goPrev: this.goPrev,
      goNext: this.goNext,
      goLast: this.goLast,
    };
  }
}
</script>
</body>
</html>
