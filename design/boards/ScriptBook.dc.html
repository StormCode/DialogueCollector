<script type="text/x-dc" data-dc-script data-props='{"empty":{"editor":"boolean","default":false},"searchQuery":{"editor":"text","default":""},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      expanded: true,
      page: 1,
      query: props.searchQuery ?? '',
      filterOpen: false,
      selectedSources: [],
      selectedCats: [],
    };
    this.PAGE_SIZE = 8;
    this.BOOKS = Array.from({ length: 26 }, (_, i) => ({
      id: i + 1,
      name: '角色名稱',
      source: '動畫／戲劇名稱',
      cv: 'CV／飾演',
      image: null,
    }));
    this.SOURCES = Array.from({ length: 14 }, (_, i) => `作品名稱 ${String(i + 1).padStart(2, '0')}`);
    this.CATS = ['動畫', '電影', '電視劇'];
  }

  toggleExpand = () => {
    this.setState({ expanded: !this.state.expanded });
  };

  handleAdd = () => {
    // TODO: 開啟「新增台詞本」流程
  };

  handleQueryChange = (e) => {
    this.setState({ query: e.target.value, page: 1 });
  };

  handleQueryClear = () => {
    this.setState({ query: '', page: 1 });
  };

  toggleFilter = () => {
    this.setState({ filterOpen: !this.state.filterOpen });
  };

  toggleSource = (name) => {
    const cur = this.state.selectedSources || [];
    const next = cur.includes(name) ? cur.filter((n) => n !== name) : [...cur, name];
    this.setState({ selectedSources: next });
  };

  toggleCat = (name) => {
    const cur = this.state.selectedCats || [];
    const next = cur.includes(name) ? cur.filter((n) => n !== name) : [...cur, name];
    this.setState({ selectedCats: next });
  };

  getFiltered = () => {
    const query = (this.state.query || '').trim();
    if (!query) return this.BOOKS;
    return this.BOOKS.filter((b) => b.name.includes(query) || b.cv.includes(query));
  };

  totalPages = () => Math.max(1, Math.ceil(this.getFiltered().length / this.PAGE_SIZE));

  goToPage = (n) => {
    const total = this.totalPages();
    const clamped = Math.min(Math.max(1, n), total);
    this.setState({ page: clamped });
  };

  goFirst = () => this.goToPage(1);
  goPrev = () => this.goToPage((this.state.page ?? 1) - 1);
  goNext = () => this.goToPage((this.state.page ?? 1) + 1);
  goLast = () => this.goToPage(this.totalPages());

  buildPageItems = (current, total) => {
    const nums = [1];
    const delta = 1;
    for (let i = Math.max(2, current - delta); i <= Math.min(total - 1, current + delta); i++) {
      nums.push(i);
    }
    if (total > 1) nums.push(total);
    const items = [];
    let prev = 0;
    nums.forEach((n) => {
      if (n - prev > 1) {
        items.push({ isEllipsis: true, isPage: false, label: '…' });
      }
      items.push({
        isEllipsis: false,
        isPage: true,
        label: String(n),
        currentClass: n === current ? 'is-current' : '',
        go: () => this.goToPage(n),
      });
      prev = n;
    });
    return items;
  };

  renderVals() {
    const expanded = this.state.expanded ?? true;
    const filterOpen = this.state.filterOpen ?? false;
    const selectedSources = this.state.selectedSources || [];
    const selectedCats = this.state.selectedCats || [];
    const sourceTags = selectedSources.map((name) => ({ name, remove: () => this.toggleSource(name) }));
    const catTags = selectedCats.map((name) => ({ name, remove: () => this.toggleCat(name) }));
    const sourceOptions = this.SOURCES.map((name) => ({
      name,
      checked: selectedSources.includes(name),
      toggle: () => this.toggleSource(name),
    }));
    const catOptions = this.CATS.map((name) => ({
      name,
      checked: selectedCats.includes(name),
      toggle: () => this.toggleCat(name),
    }));
    const isEmpty = !!(this.props.empty ?? false);
    const filtered = isEmpty ? [] : this.getFiltered();
    const total = this.totalPages();
    const page = Math.min(Math.max(1, this.state.page ?? 1), total);
    const cols = 2;
    const start = (page - 1) * this.PAGE_SIZE;
    const pageBooks = filtered.slice(start, start + this.PAGE_SIZE);
    const books = pageBooks.map((b, i) => {
      const row = Math.floor(i / cols); // top row appears first; each card still rises up from below as it fades in
      return {
        id: b.id,
        name: b.name,
        source: b.source,
        cv: b.cv,
        image: b.image,
        hasImage: !!b.image,
        noImage: !b.image,
        delay: (row * 180) + 'ms',
        open: () => {
          // TODO: 開啟此台詞本
        },
        edit: (e) => {
          e.stopPropagation();
          // TODO: 開啟編輯此角色的表單
        },
      };
    });
    return {
      isEmpty,
      noResult: !isEmpty && filtered.length === 0,
      notEmpty: !isEmpty && filtered.length > 0,
      expanded,
      toggleExpand: this.toggleExpand,
      chevronName: expanded ? 'ChevronRight' : 'ChevronLeft',
      toggleLabel: expanded ? '收合選單' : '展開選單',
      books,
      handleAdd: this.handleAdd,
      query: this.state.query ?? '',
      handleQueryChange: this.handleQueryChange,
      handleQueryClear: this.handleQueryClear,
      filterOpen,
      toggleFilter: this.toggleFilter,
      filterBtnClass: (filterOpen || selectedSources.length || selectedCats.length) ? 'is-active' : '',
      sourceTags,
      catTags,
      sourceOptions,
      catOptions,
      pageItems: this.buildPageItems(page, total),
      isFirstPage: page <= 1,
      isLastPage: page >= total,
      goFirst: this.goFirst,
      goPrev: this.goPrev,
      goNext: this.goNext,
      goLast: this.goLast,
    };
  }
}
</script>
</body>
