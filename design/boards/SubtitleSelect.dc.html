  subs = () => this.state.subs || this.SUBTITLES;

  // ---------- 播放（模擬，邏輯同台詞頁：點同一句＝暫停/繼續，點別句＝改播該句） ----------
  stopTimer = () => { if (this.timer) { clearInterval(this.timer); this.timer = null; } };
  startTimer = () => { this.stopTimer(); this.timer = setInterval(this.tick, 100); };
  tick = () => {
    const { playId, playPaused, playProgress } = this.state;
    if (playPaused || playId == null) return;
    const line = this.subs().find((l) => l.id === playId);
    if (!line) { this.stopPlay(); return; }
    const next = (playProgress || 0) + 100 / Math.max(300, line.end - line.start);
    if (next < 1) this.setState({ playProgress: next }); else this.stopPlay();
  };
  stopPlay = () => { this.stopTimer(); this.setState({ playId: null, playPaused: false, playProgress: 0 }); };
  togglePlay = (id, e) => {

  selectedIds = () => {

  cutAt = (str) => {
    if (!str) return ['', ''];
    const chars = Array.from(str);
    const mid = chars.length / 2;
    let best = -1;
    chars.forEach((ch, i) => {
      if (i < chars.length - 1 && '、，。？！,.?! '.includes(ch) && (best < 0 || Math.abs(i + 1 - mid) < Math.abs(best - mid))) best = i + 1;
    });
    if (best < 0) best = Math.max(1, Math.round(mid));
    return [chars.slice(0, best).join('').trim(), chars.slice(best).join('').trim()];

  canMerge = (ids) => {
    if (ids.length < 2) return false;

    const ids = this.selectedIds();

    const list = this.subs().slice();
    const i = list.findIndex((r) => r.id === ids[0]);
    const r = list[i];
    const [t1, t2] = this.cutAt(r.text);

    const ratio = Array.from(t1).length / Math.max(1, Array.from(r.text).length);
    const cut = Math.round(r.start + (r.end - r.start) * ratio);

    list.splice(i, 1, { ...r, end: cut, text: t1, translation: tr1, merged: false }, { id: newId, start: cut, end: r.end, text: t2, translation: tr2 });

  };
  handleMerge = () => {
    const ids = this.selectedIds();
    if (!this.canMerge(ids)) return;
    this.stopPlay();
    const list = this.subs();
    const parts = list.filter((r) => ids.includes(r.id));
    const first = parts[0];
    const merged = {
      ...first,
      end: parts[parts.length - 1].end,
      text: parts.map((p) => p.text).join(''),

  _baseRenderVals() {

    const selected = this.state.selected || {};
    const assigned = this.state.assigned || {};
    const noSubtitles = !!(this.props.noSubtitles ?? false);
    const playId = this.state.playId ?? null;
    const playPaused = !!this.state.playPaused;
    const rows = (noSubtitles ? [] : this.subs()).map((r) => {
      const isSelected = !!selected[r.id];
      const isPlaying = playId === r.id;
      return {
        id: r.id,
        time: this.formatTime(r.start) + ' ~ ' + this.formatTime(r.end),
        text: r.text,
        translation: r.translation,
        hasTranslation: !!r.translation,
        selected: isSelected,
        rowClass: (isSelected ? 'is-selected' : '') + (isPlaying ? ' is-playing' : ''),
        playIcon: isPlaying && !playPaused ? 'pause' : 'play_arrow',
        playLabel: (isPlaying && !playPaused ? '暫停' : '播放') + '第 ' + r.id + ' 句',
        togglePlay: (e) => this.togglePlay(r.id, e),
        isMerged: !!r.merged,
        gap: r.merged ? String(r.gap ?? 0.5) : '',
        setGap: (e) => this.setGap(r.id, e),
        stopClick: (e) => { if (e) { e.preventDefault && e.target && e.target.tagName !== 'INPUT' && e.preventDefault(); e.stopPropagation && e.stopPropagation(); } },
        boxClass: isSelected ? 'is-checked' : '',
        ariaLabel: '選取字幕 ' + r.id,
        noChar: !assigned[r.id],
        pickClass: this.state.pickerRow === r.id ? 'is-open' : '',
        openPicker: (e) => this.openPicker(r.id, e),
        ...(() => {
          const c = this.CHARACTERS.find((x) => x.id === assigned[r.id]);
          if (!c) return { hasChar: false, charName: '', charBg: 'transparent', charFg: 'inherit', charInitial: '', charImg: '', charImgPos: '50% 50%', charHasImg: false, charNoImg: true };
          const st = this.charStyle(c);

        })(),
        toggle: () => this.setState((prev) => ({ selected: { ...prev.selected, [r.id]: !prev.selected[r.id] } })),
      };
    });
    const count = rows.filter((r) => r.selected).length;
    const assignedCount = rows.filter((r) => r.hasChar).length;
    const menuOpen = !!this.state.menuOpen && count > 0;
    const pickerRow = this.state.pickerRow ?? null;
    const pq = (this.state.pickQuery || '').trim().toLowerCase();
    const pickChars = pq ? this.CHARACTERS.filter((c) => c.name.toLowerCase().includes(pq) || (c.show || '').toLowerCase().includes(pq)) : this.CHARACTERS;
    return {
      expanded,
      toggleExpand: this.toggleExpand,
      chevronName: expanded ? 'ChevronRight' : 'ChevronLeft',
      toggleLabel: expanded ? '收合選單' : '展開選單',
      rows,
      listClass: count > 0 ? 'has-selection' : '',
      selectedCount: count,
      importDisabled: assignedCount === 0,
      assignedCount,
      showUnassignMenu: !(this.state.charQuery || '').trim(),
      unassignSelected: () => this.assignTo(null),
      showUnassignPick: !(this.state.pickQuery || '').trim(),
      pickNone: () => this.pickFor(pickerRow, null),
      pickNoneCls: pickerRow !== null && !assigned[pickerRow] ? 'is-current' : '',
      pickNoneCurrent: pickerRow !== null && !assigned[pickerRow] ? 'true' : 'false',
      noSubtitles,
      showToast: noSubtitles && !this.state.toastDismissed,
      dismissToast: this.dismissToast,
      setCardRef: this.setCardRef,
      pickerOpen: pickerRow !== null,
      pickerLeft: this.state.pickerLeft || '160px',
      pickerTop: this.state.pickerTop || '120px',
      closePicker: this.closePicker,
      pickQuery: this.state.pickQuery ?? '',
      handlePickQuery: this.handlePickQuery,
      clearPickQuery: this.clearPickQuery,
      pickNoResult: pickChars.length === 0,
      pickItems: pickChars.map((c) => {
        const st = this.charStyle(c);
        const isCur = pickerRow !== null && assigned[pickerRow] === c.id;
        return { name: c.name, bg: st.bg, fg: st.fg, initial: st.initial, img: st.img, imgPos: st.imgPos, hasImg: st.hasImg, noImg: st.noImg, cls: isCur ? 'is-current' : '', current: isCur ? 'true' : 'false', pick: () => this.pickFor(pickerRow, c.id) };
      }),
      totalCount: rows.length,
      avatarClass: '',
      assignDisabled: count === 0,
      menuOpen,
      menuChevron: menuOpen ? 'ChevronUp' : 'ChevronDown',
      toggleMenu: this.toggleMenu,
      handleAddCharacter: this.handleAddCharacter,
      charQuery: this.state.charQuery ?? '',
      handleCharQuery: this.handleCharQuery,
      clearCharQuery: this.clearCharQuery,
      charNoResult: this.filteredChars().length === 0,
      characterMenuItems: this.filteredChars().map((c) => {
        const st = this.charStyle(c);
        return { name: c.name, show: c.show, bg: st.bg, fg: st.fg, initial: st.initial, img: st.img, imgPos: st.imgPos, hasImg: st.hasImg, noImg: st.noImg, pick: () => this.assignTo(c.id) };
      }),
      handleSelectAll: this.handleSelectAll,
      splitDisabled: count !== 1,
      mergeDisabled: noSubtitles || !this.canMerge(this.selectedIds()),
      swapDisabled: noSubtitles,
      handleSplit: this.handleSplit,
      handleMerge: this.handleMerge,
      handleSwap: this.handleSwap,
      handleClearAll: this.handleClearAll,
      handleBack: this.handleBack,
      handleImport: this.handleImport,
    };
  }

    const embedded = (this.props.flow ?? 'subtitle') === 'embedded';
    v.isFlowSubtitle = !embedded;
    v.isFlowEmbedded = embedded;
    v.stepNo = embedded ? 3 : 2;
    const dark = (this.props.theme ?? 'light') === 'midnight';
    v.theme = dark ? 'midnight' : 'light';
    v.themeStyle = dark ? "color-scheme: dark; --bento-neutral-1: #1b222c; --bento-neutral-5: #242c37; --bento-neutral-10: #2e3743; --bento-neutral-20: #3d4756; --bento-neutral-30: #566273; --bento-neutral-40: #76849a; --bento-neutral-50: #9aa8bc; --bento-neutral-60: #b6c2d3; --bento-neutral-70: #cbd4e1; --bento-neutral-80: #dee4ed; --bento-neutral-90: #eef1f6; --bento-bg-primary: #1f2630; --bento-bg-secondary: #141a22; --bento-bg-overlay: rgba(255,255,255,0.06); --bento-bg-interactive-overlay: rgba(255,255,255,0.08); --bento-content-primary: #eef1f6; --bento-content-secondary: #9aa8bc; --bento-content-disabled: rgba(255,255,255,0.3); --bento-icon-primary: #eef1f6; --bento-icon-secondary: #9aa8bc; --bento-border-decorative: #3d4756; --bento-border-container: rgba(255,255,255,0.08); --bento-border-input-enabled: #566273; --bento-border-input-hover: #76849a; --bento-border-input-focus: #cbd4e1; --bento-border-input-disabled: rgba(255,255,255,0.12); --bento-action-disabled-bg: rgba(255,255,255,0.1); --bento-action-disabled-fg: #76849a; --bento-bg-negative: rgba(241,74,88,0.16); --bento-negative-1: rgba(241,74,88,0.12); --bento-negative-5: rgba(241,74,88,0.2); --bento-negative-10: rgba(241,74,88,0.32); --bento-content-negative: #fa7d87; --bento-negative-50: #fa7d87; --bento-icon-negative: #fa7d87; --bento-negative-60: #ffb6bc; --bento-bg-positive: rgba(66,215,91,0.16); --bento-content-positive: #7eeb83; --bento-icon-positive: #7eeb83; --bento-positive-60: #7eeb83; --bento-bg-warning: rgba(252,179,59,0.16); --bento-warning-70: #ffcf73; --bento-elevation-sm: 0 4px 8px rgba(0,0,0,0.4); --bento-elevation-md: 0 8px 16px rgba(0,0,0,0.45); --bento-elevation-lg: 0 16px 32px rgba(0,0,0,0.5); --bento-dv-indigo-1: #242c37; --bento-dv-indigo-5: #2a3340; --bento-dv-indigo-10: #2e3743; --bento-dv-indigo-20: #566273; --bento-dv-indigo-30: #9aa8bc; --bento-dv-indigo-40: #cbd4e1; --bento-dv-indigo-50: #dee4ed; --bento-dv-indigo-60: #eef1f6; --bento-dv-indigo-70: #eef1f6; --bento-dv-indigo-80: #eef1f6; --bento-dv-indigo-90: #eef1f6; --solid-bg: #4a5568; --solid-bg-hover: #566273; --bento-bg-interactive: #4a5568; --bento-action-solid-primary-bg: #4a5568; --bento-action-solid-primary-bg-hover: #566273; --bento-action-solid-primary-fg: #ffffff; --bento-action-solid-primary-fg-hover: #ffffff; --bento-action-outline-primary-outline: #cbd4e1; --bento-action-outline-primary-outline-hover: #eef1f6; --bento-action-transparent-primary-fg: #dee4ed; --bento-action-transparent-primary-fg-hover: #ffffff; --bento-action-transparent-primary-bg-hover: rgba(255,255,255,0.08);" : '';
    return v;
  }
}
