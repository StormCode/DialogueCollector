<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
  <link rel="stylesheet" href="ds/bento/tokens.css">
  <link rel="stylesheet" href="ds/bento/components/bundle.css">
  <script src="ds/bento/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,200,0,0&amp;display=block" rel="stylesheet">
  <style>
    body { margin: 0; }
    .dz-browse { appearance: none; -webkit-appearance: none; box-sizing: border-box; border-radius: 16px; background: transparent; font-family: var(--font-bento-font-ui); font-weight: 500; font-size: 14px; line-height: 18px; padding: 12px 16px; cursor: pointer; }
    .nav-item { appearance: none; -webkit-appearance: none; border: none; background: transparent; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; width: 64px; padding: 8px 4px; border-radius: 8px; cursor: pointer; font-family: var(--font-bento-font-ui); font-weight: 500; font-size: 12px; line-height: 16px; }
    .material-symbol { font-family: 'Material Symbols Outlined'; font-weight: normal; font-style: normal; font-size: 24px; line-height: 1; letter-spacing: normal; text-transform: none; display: inline-block; white-space: nowrap; word-wrap: normal; direction: ltr; font-variation-settings: 'FILL' 0, 'wght' 200, 'GRAD' 0, 'opsz' 24; }
    .lib-toast { display: flex; align-items: center; gap: 12px; width: 560px; box-sizing: border-box; padding: 12px 12px 12px 24px; border-radius: var(--bento-radius-16); background: var(--bento-bg-negative); box-shadow: var(--bento-elevation-lg); }
    .lib-toast-btn { flex-shrink: 0; display: inline-flex; align-items: center; gap: 6px; box-sizing: border-box; padding: 8px 14px 8px 12px; border-radius: var(--bento-radius-12); border: 1.5px solid var(--bento-negative-40); background: var(--bento-bg-primary); color: var(--bento-negative-50); font: var(--bento-weight-medium) 14px/18px var(--bento-font-ui); text-decoration: none; cursor: pointer; }
    .lib-toast-btn:hover { background: var(--bento-negative-40); color: var(--bento-white); }
    .lib-toast-close { appearance: none; -webkit-appearance: none; flex-shrink: 0; width: 36px; height: 36px; border: none; border-radius: var(--bento-radius-8); background: transparent; color: var(--bento-negative-50); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
    .lib-toast-close:hover { background: rgba(228, 33, 49, 0.1); }
    @keyframes lib-toast-in { from { opacity: 0; transform: translate(-50%, -12px); } to { opacity: 1; transform: translate(-50%, 0); } }
    .lib-toast-wrap { animation: lib-toast-in 280ms ease-out both; }
    @media (prefers-reduced-motion: reduce) { .lib-toast-wrap { animation: none; } }
    @keyframes pg-title-fade { from { opacity: 0; } to { opacity: 1; } }
    .pg-anim-title { animation: pg-title-fade 450ms ease-out backwards; }
    @media (prefers-reduced-motion: reduce) { .pg-anim-title { animation: none; } }
    @keyframes pg-in-up { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: translateY(0); } }
    .pg-anim-up { animation: pg-in-up 920ms cubic-bezier(0.22, 1, 0.36, 1) backwards; }
    @media (prefers-reduced-motion: reduce) { .pg-anim-up { animation: none; } }
  </style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; border-radius: 24px; overflow: hidden; background: var(--bento-bg-secondary); display: flex; flex-direction: column; padding: 80px; gap: 40px; font-family: var(--font-bento-font-ui); position: relative; z-index: 0;">

  <svg viewBox="0 0 1280 800" preserveAspectRatio="none" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none;">
    <path d="M 1020,0 C 1070,56 1100,175 1100,250 C 1100,415 1010,635 1000,800 L 1284,804 L 1284,-4 Z" style="fill: var(--bento-dv-indigo-5);"></path>
  </svg>

  <div style="position: absolute; top: 50%; right: 0; transform: translateY(-50%); display: flex; flex-direction: column; align-items: stretch; gap: 4px; background: var(--bento-bg-primary); border: 1px solid var(--bento-neutral-5); border-right: none; border-top-left-radius: 16px; border-bottom-left-radius: 16px; box-shadow: -4px 0px 8px rgba(0, 0, 0, 0.16); padding: 8px;">
    <button type="button" aria-label="{{toggleLabel}}" onClick="{{toggleExpand}}" style="appearance: none; -webkit-appearance: none; position: absolute; top: 50%; left: -20px; transform: translateY(-50%); width: 20px; height: 56px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; background: var(--bento-bg-primary); border: 1px solid var(--bento-neutral-5); border-right: none; border-radius: 999px 0 0 999px; box-shadow: -2px 0px 4px rgba(0, 0, 0, 0.12); color: var(--bento-icon-secondary); cursor: pointer;">
      <x-import component-from-global-scope="BentoDS27_65ebe9.Icon" name="{{chevronName}}" size="16"></x-import>
    </button>
    <button type="button" class="nav-item" style="color: var(--bento-informative-30); background-color: var(--bento-dv-indigo-5)">
      <span style="display: inline-flex; color: var(--bento-dv-indigo-30);">
        <x-import component-from-global-scope="BentoDS27_65ebe9.Icon" name="Home" size="24"></x-import>
      </span>
      <sc-if value="{{expanded}}" hint-placeholder-val="{{true}}"><span style="color: var(--bento-dv-indigo-30)">主頁</span></sc-if>
    </button>
    <button type="button" class="nav-item" style="color: var(--bento-content-secondary);">
      <span class="material-symbol" aria-hidden="true">book_2</span>
      <sc-if value="{{expanded}}" hint-placeholder-val="{{true}}"><span>台詞本</span></sc-if>
    </button>
    <button type="button" class="nav-item" style="color: var(--bento-content-secondary);">
      <x-import component-from-global-scope="BentoDS27_65ebe9.Icon" name="Gear" size="24"></x-import>
      <sc-if value="{{expanded}}" hint-placeholder-val="{{true}}"><span>設定</span></sc-if>
    </button>
  </div>

  <h1 class="pg-anim-title" style="margin: 0; text-align: center; font-family: var(--font-bento-font-heading); font-weight: 600; font-size: 32px; line-height: 32px; color: var(--bento-content-primary);">請選擇其中一種匯入台詞的方式</h1>
  <div style="flex-grow: 1; display: flex; gap: 40px; align-items: stretch; justify-content: center; min-height: 0;">

    <div class="pg-anim-up" style="flex: 1 1 0; max-width: 480px; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 40px; padding-top: 20px; animation-delay: 450ms;">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center;">
        <div style="font-family: var(--font-bento-font-ui); font-weight: 600; font-size: 20px; line-height: 26px; color: var(--bento-content-primary);">依字幕的時間軸切分影片為多個片段</div>
        <div style="font-family: var(--font-bento-font-ui); font-weight: 400; font-size: 14px; line-height: 20px; color: var(--bento-content-secondary);">支援 ASS、SRT</div>
      </div>
      <div style="flex: 1 1 auto; width: 100%; box-sizing: border-box; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; background: var(--bento-bg-primary); border: 3px dashed var(--bento-interactive-40); border-radius: 24px; padding: 40px;">
        <span class="material-symbol" aria-hidden="true" style="position: absolute; top: 221px; right: 24px; font-size: 230px; color: var(--bento-interactive-40); opacity: 0.2; transform: rotate(15deg); pointer-events: none">subtitles</span>
        <div style="position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 16px;">
          <div style="font-family: var(--font-bento-font-ui); font-weight: 500; font-size: 16px; line-height: 22px; color: var(--bento-interactive-40);">將檔案拖放到這裡</div>
          <div style="font-family: var(--font-bento-font-ui); font-weight: 400; font-size: 13px; line-height: 18px; color: var(--bento-content-secondary);">或</div>
          <button type="button" class="dz-browse" style="border: 2px solid var(--bento-interactive-40); color: var(--bento-interactive-40);">瀏覽檔案</button>
        </div>
      </div>
    </div>

    <div class="pg-anim-up" style="flex: 1 1 0; max-width: 480px; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 40px; padding-right: 0px; padding-left: 0px; padding-top: 20px; animation-delay: 600ms;">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center;">
        <div style="font-family: var(--font-bento-font-ui); font-weight: 600; font-size: 20px; line-height: 26px; color: var(--bento-content-primary);">直接匯入現有的影片或音訊</div>
        <div style="font-family: var(--font-bento-font-ui); font-weight: 400; font-size: 14px; line-height: 20px; color: var(--bento-content-secondary);">支援 MKV、MP4、WEBM、OGG、M4A、MP3</div>
      </div>
      <div style="flex: 1 1 auto; width: 100%; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: var(--bento-bg-primary); border: 3px dashed var(--bento-positive-50); border-radius: 24px; padding: 40px; border-color: #16C459">
        <span class="material-symbol" aria-hidden="true" style="position: absolute; top: 15%; left: 20%; font-size: 130px; color: #16C459; opacity: 0.2; pointer-events: none;">movie</span>
        <span class="material-symbol" aria-hidden="true" style="position: absolute; bottom: 15%; right: 20%; font-size: 130px; color: #16C459; opacity: 0.2; pointer-events: none;">graphic_eq</span>
        <div style="font-family: var(--font-bento-font-ui); font-weight: 500; font-size: 16px; line-height: 22px; color: #16C459">將檔案拖放到這裡</div>
        <div style="font-family: var(--font-bento-font-ui); font-weight: 400; font-size: 13px; line-height: 18px; color: var(--bento-content-secondary);">或</div>
        <button type="button" class="dz-browse" style="border: 2px solid var(--bento-positive-50); color: #16C459; border-color: #16C459">瀏覽檔案</button>
      </div>
    </div>

  </div>

  <sc-if value="{{showLibToast}}" hint-placeholder-val="{{false}}">
    <div class="lib-toast-wrap" role="alert" style="position: absolute; top: 24px; left: 50%; transform: translateX(-50%); z-index: 50;">
      <div class="lib-toast">
        <span style="display: inline-flex; flex-shrink: 0; color: var(--bento-icon-negative);"><x-import component-from-global-scope="BentoDS27_65ebe9.Icon" name="NegativeSolid" size="16"></x-import></span>
        <span style="flex: 1 1 auto; min-width: 0; font: var(--bento-weight-regular) 14px/20px var(--bento-font-ui); color: var(--bento-content-negative);">找不到收藏庫，請至「設定 → 檔案管理」指定收藏庫位置</span>
        <a class="lib-toast-btn" href="Settings.dc.html"><x-import component-from-global-scope="BentoDS27_65ebe9.Icon" name="GearWeightRegular" size="18"></x-import>設定</a>
        <button type="button" class="lib-toast-close" aria-label="關閉" onClick="{{dismissLibToast}}"><x-import component-from-global-scope="BentoDS27_65ebe9.Icon" name="XWeightBold" size="16"></x-import></button>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script data-dc-script data-props='{"libraryNotFound":{"editor":"boolean","default":false},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { expanded: true };
  }

  toggleExpand = () => {
    this.setState({ expanded: !this.state.expanded });
  };

  dismissLibToast = () => this.setState({ libToastDismissed: true });

  renderVals() {
    const expanded = this.state.expanded ?? true;
    return {
      showLibToast: !!(this.props.libraryNotFound ?? false) && !this.state.libToastDismissed,
      dismissLibToast: this.dismissLibToast,
      expanded,
      toggleExpand: this.toggleExpand,
      chevronName: expanded ? 'ChevronRight' : 'ChevronLeft',
      toggleLabel: expanded ? '收合選單' : '展開選單',
    };
  }
}
</script>
</body>
</html>
