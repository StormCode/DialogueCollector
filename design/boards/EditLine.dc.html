  <style>
    body { margin: 0; }
    .nav-item { appearance: none; -webkit-appearance: none; border: none; background: transparent; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; width: 64px; padding: 8px 4px; border-radius: 8px; cursor: pointer; font-family: var(--font-bento-font-ui); font-weight: 500; font-size: 12px; line-height: 16px; }

      <x-import component-from-global-scope="BentoDS27_65ebe9.Field" kind="textarea" label="台詞譯文 (optional)" placeholder="請輸入這段台詞的翻譯文字…" value="{{translationText}}" on-change="{{handleTranslationChange}}" width="{{fieldWidth}}" rows="7"></x-import>

          <span style="flex: 1; min-width: 0; font: var(--bento-weight-regular) 16px/20px var(--font-bento-font-ui); color: {{characterDisplayColor}}; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{characterDisplayLabel}}</span>

            <div style="width: 100%; box-sizing: border-box; padding: 0 0 8px; --bento-border-input-enabled: var(--bento-dv-indigo-40); --bento-border-input-hover: var(--bento-dv-indigo-50); --bento-border-input-focus: var(--bento-dv-indigo-50);">
              <x-import component-from-global-scope="BentoDS27_65ebe9.SearchBar" placeholder="角色 or 作品名稱" value="{{charQuery}}" onChange="{{handleCharQuery}}" onClear="{{clearCharQuery}}" width="100%" style="width: 100%;"></x-import>
            </div>
            <sc-for list="{{characterMenuItems}}" as="item" hint-placeholder-count="5">

                <span style="display: flex; align-items: center; gap: 12px; min-width: 0;">
                  <span aria-hidden="true" style="box-sizing: border-box; width: 28px; height: 28px; flex-shrink: 0; border-radius: 50%; overflow: hidden; display: flex; align-items: center; justify-content: center; background: {{item.avBg}}; color: {{item.avFg}}; font: var(--bento-weight-semibold) 12px/1 var(--font-bento-font-ui);"><sc-if value="{{item.hasImg}}" hint-placeholder-val="{{false}}"><img src="{{item.img}}" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block; object-position: {{item.imgPos}};"></sc-if><sc-if value="{{item.noImg}}" hint-placeholder-val="{{true}}">{{item.initial}}</sc-if></span>
                  <span style="font: var(--bento-weight-regular) 14px/18px var(--font-bento-font-ui); color: var(--bento-content-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{item.name}}</span>

            <div style="height: 1px; background: var(--bento-border-decorative); margin: 8px 4px;"></div>
            <button type="button" onClick="{{handleAddCharacter}}" style="appearance: none; -webkit-appearance: none; display: flex; align-items: center; gap: 8px; padding: 10px 12px; border: none; border-radius: var(--bento-radius-16); background: transparent; cursor: pointer; text-align: left; color: var(--bento-content-secondary);">

        </sc-if>
      </div><div style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
        <a href="Lines.dc.html" style="box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 11.5px 24px 11.5px 16px; border-radius: var(--bento-radius-16); border: 1.5px solid var(--bento-neutral-60); background: transparent; color: var(--bento-neutral-60); font: var(--bento-weight-medium) 14px/18px var(--bento-font-ui); text-decoration: none; cursor: pointer;"><span class="material-symbol" aria-hidden="true">close</span>取消</a>
        <div style="display: flex; align-items: center; justify-content: flex-end; gap: 12px;">

              <x-import component-from-global-scope="BentoDS27_65ebe9.Icon" name="PositiveCircle" size="18"></x-import>
              已儲存變更

          <button type="button" onClick="{{handleConfirm}}" style="appearance: none; -webkit-appearance: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 13px 24px 13px 20px; border-radius: var(--bento-radius-16); border: none; background: var(--solid-bg, var(--bento-dv-indigo-40)); color: var(--bento-white); font: var(--bento-weight-medium) 14px/18px var(--bento-font-ui); cursor: pointer;"><span class="material-symbol" aria-hidden="true">save</span>儲存</button>

<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","midnight"],"default":"light"},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      expanded: true,
      lineText: '不管發生什麼事，我都會站在你這邊。',
      translationText: '',
      character: 'yuki',
      charMenuOpen: false,
      attemptedSubmit: false,
      submitted: false,
      playing: false,
      currentTime: 0,
      duration: 4,
    };
    this._timer = null;
    this.CHARACTERS = [
      { id: 'yuki', name: '優希', show: '他是傳奇', ramp: 'indigo', img: '/_blob/8e7c48a81577b215f6492ed5ac49e399', imgPos: '50% 45%' },
      { id: 'frieren', name: '芙莉蓮', show: '葬送的芙莉蓮', ramp: 'jade', img: '/_blob/d21b13f3cadc7105e91cae2176052ebd', imgPos: '47% 45%' },
      { id: 'fern', name: '費倫', show: '葬送的芙莉蓮', ramp: 'violet' },
      { id: 'lena', name: '蕾娜', show: '86－不存在的戰區－', ramp: 'pink' },
      { id: 'kenshin', name: '緋村劍心', show: '神劍闖江湖', ramp: 'red' },
      { id: 'okabe', name: '岡部倫太郎', show: '命運石之門', ramp: 'orange' },
    ];
  }

  componentWillUnmount() {
    this.stopTicking();
  }

  toggleExpand = () => {
    this.setState({ expanded: !this.state.expanded });
  };

  startTicking = () => {
    this.stopTicking();
    this._timer = setInterval(() => {
      this.setState((prev) => {
        const next = Math.min(prev.duration, prev.currentTime + 1);
        if (next >= prev.duration) {
          this.stopTicking();
          return { currentTime: next, playing: false };
        }
        return { currentTime: next };
      });
    }, 1000);
  };

  stopTicking = () => {
    if (this._timer) {
      clearInterval(this._timer);
      this._timer = null;
    }
  };

  handleTogglePlay = () => {
    this.setState((prev) => {
      const playing = !prev.playing;
      if (playing) {
        this.startTicking();
      } else {
        this.stopTicking();
      }
      return { playing };
    });
  };

  formatTime = (seconds) => {
    const s = Math.max(0, Math.round(seconds || 0));
    const m = Math.floor(s / 60);
    const r = s % 60;
    return m + ':' + (r < 10 ? '0' : '') + r;
  };

  handleTextChange = (e) => {
    this.setState({ lineText: e.target.value, submitted: false });
  };

  handleTranslationChange = (e) => {
    this.setState({ translationText: e.target.value, submitted: false });
  };

  handleCharQuery = (e) => this.setState({ charQuery: e.target.value });
  clearCharQuery = () => this.setState({ charQuery: '' });
  filteredChars = () => {
    const q = (this.state.charQuery || '').trim().toLowerCase();
    if (!q) return this.CHARACTERS;
    return this.CHARACTERS.filter((c) => c.name.toLowerCase().includes(q) || (c.show || '').toLowerCase().includes(q));
  };

  toggleCharacterMenu = () => {
    this.setState((prev) => ({ charMenuOpen: !prev.charMenuOpen }));
  };

  selectCharacter = (id) => {
    this.setState({ charQuery: '' });
    this.setState({ character: id, charMenuOpen: false, submitted: false });
  };

  handleAddCharacter = () => {
    this.setState({ charMenuOpen: false });
  };

  handleBack = () => {
    // TODO: 回到上一步
  };

  handleConfirm = () => {
    const lineText = this.state.lineText || '';
    const character = this.state.character || '';
    const valid = !!lineText.trim() && !!character;
    this.setState({ attemptedSubmit: true, submitted: valid });
  };

  _baseRenderVals() {
    const expanded = this.state.expanded ?? true;
    const lineText = this.state.lineText ?? '';
    const translationText = this.state.translationText ?? '';
    const character = this.state.character ?? '';
    const attemptedSubmit = this.state.attemptedSubmit ?? false;
    const playing = this.state.playing ?? false;
    const currentTime = this.state.currentTime ?? 0;
    const duration = this.state.duration ?? 0;
    const charMenuOpen = this.state.charMenuOpen ?? false;
    const charError = attemptedSubmit && !character ? '請選擇角色' : undefined;
    const selectedCharacterObj = this.CHARACTERS.find((c) => c.id === character) || null;
    return {
      expanded,
      toggleExpand: this.toggleExpand,
      chevronName: expanded ? 'ChevronRight' : 'ChevronLeft',
      toggleLabel: expanded ? '收合選單' : '展開選單',
      lineText,
      translationText,
      character,
      handleTextChange: this.handleTextChange,
      handleTranslationChange: this.handleTranslationChange,
      handleBack: this.handleBack,
      handleConfirm: this.handleConfirm,
      submitted: this.state.submitted ?? false,
      textError: attemptedSubmit && !lineText.trim() ? '請輸入台詞內容' : undefined,
      charError,
      fieldWidth: 560,
      playing,
      notPlaying: !playing,
      currentTime,
      duration,
      progressPercent: duration > 0 ? Math.max(0, Math.min(100, (currentTime / duration) * 100)) : 0,
      handleTogglePlay: this.handleTogglePlay,
      playButtonLabel: playing ? '暫停' : '播放',
      playBtnClass: playing ? 'is-playing' : '',
      timeLabel: this.formatTime(currentTime) + ' / ' + this.formatTime(duration),
      charMenuOpen,
      toggleCharacterMenu: this.toggleCharacterMenu,
      handleAddCharacter: this.handleAddCharacter,
      characterDisplayLabel: selectedCharacterObj ? selectedCharacterObj.name : '請選擇角色',
      characterDisplayColor: selectedCharacterObj ? 'var(--bento-content-primary)' : 'var(--bento-content-secondary)',
      characterChevronName: charMenuOpen ? 'ChevronUp' : 'ChevronDown',
      characterRingColor: charError ? 'var(--bento-border-negative)' : charMenuOpen ? 'var(--bento-dv-indigo-40)' : 'var(--bento-border-input-enabled)',
      characterRingWidth: charMenuOpen || charError ? 'var(--bento-border-width-strong)' : 'var(--bento-border-width)',
      charQuery: this.state.charQuery ?? '',
      handleCharQuery: this.handleCharQuery,
      clearCharQuery: this.clearCharQuery,
      charNoResult: this.filteredChars().length === 0,
      characterMenuItems: this.filteredChars().map((c) => ({
        id: c.id,
        name: c.name,
        show: c.show,
        avBg: 'var(--bento-dv-' + (c.ramp || 'indigo') + '-10)',
        avFg: 'var(--bento-dv-' + (c.ramp || 'indigo') + '-70)',
        initial: c.name.charAt(0),
        img: c.img || '',
        imgPos: c.imgPos || '50% 50%',
        hasImg: !!c.img,
        noImg: !c.img,
        bg: c.id === character ? 'var(--bento-bg-interactive-overlay)' : 'transparent',
        pick: () => this.selectCharacter(c.id),
      })),
    };
  }

  renderVals() {
    const v = this._baseRenderVals() || {};
