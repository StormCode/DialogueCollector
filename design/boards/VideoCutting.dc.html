<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>切割影片中</title>
  <script src="./support.js"></script>
  <link rel="stylesheet" href="ds/bento/tokens.css">
  <link rel="stylesheet" href="ds/bento/components/bundle.css">
  <script src="ds/bento/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,200,0,0&amp;display=block" rel="stylesheet">
  <style>
    body { margin: 0; }
    .nav-item { appearance: none; -webkit-appearance: none; border: none; background: transparent; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; width: 64px; padding: 8px 4px; border-radius: 8px; cursor: pointer; font-family: var(--font-bento-font-ui); font-weight: 500; font-size: 12px; line-height: 16px; }
    .material-symbol { font-family: 'Material Symbols Outlined'; font-weight: normal; font-style: normal; font-size: 24px; line-height: 1; letter-spacing: normal; text-transform: none; display: inline-block; white-space: nowrap; word-wrap: normal; direction: ltr; font-variation-settings: 'FILL' 0, 'wght' 200, 'GRAD' 0, 'opsz' 24; }
    .material-symbol-lg { font-family: 'Material Symbols Outlined'; font-weight: normal; font-style: normal; font-size: 72px; line-height: 1; letter-spacing: normal; text-transform: none; display: inline-block; white-space: nowrap; word-wrap: normal; direction: ltr; font-variation-settings: 'FILL' 0, 'wght' 200, 'GRAD' 0, 'opsz' 24; }
    @keyframes importing-streak-move {
      0% { transform: translateX(0); }
      100% { transform: translateX(170px); }
    }
    .importing-streak-track {
      position: absolute;
      top: 0;
      left: 50%;
      width: 1px;
      height: 100%;
      animation: importing-streak-move 2s ease-out infinite;
      pointer-events: none;
      z-index: 2;
    }
    /* 編輯器在編輯模式下會以 animation:none !important 凍結動畫；此規則以較高的選擇器權重讓掃光持續循環播放 */
    body[data-dc-editor-on] .importing-streak-track.importing-streak-track.importing-streak-track.importing-streak-track.importing-streak-track.importing-streak-track {
      animation: importing-streak-move 2s ease-out infinite !important;
    }
    .importing-streak-bar {
      position: absolute;
      top: 50%;
      left: 0;
      width: 120px;
      height: 220px;
      margin-top: -110px;
      margin-left: -60px;
      border-radius: 999px;
      background: var(--bento-bg-secondary);
      filter: blur(10px);
      transform: rotate(-35deg);
    }
    @keyframes complete-fade-up {
      from { opacity: 0; transform: translateY(28px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .complete-fade-icon { animation: complete-fade-up 0.7s ease-out both; }
    .complete-fade-text { animation: complete-fade-up 0.7s ease-out 0.15s both; }
    .complete-fade-actions { animation: complete-fade-up 0.7s ease-out 0.3s both; }
    .complete-btn { appearance: none; -webkit-appearance: none; box-sizing: border-box; border-radius: var(--bento-radius-16); font: var(--bento-weight-medium) 14px/18px var(--bento-font-ui); padding: 16px 24px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
    .complete-btn-icon { gap: 8px; padding: 13px 24px 13px 20px; }
    .complete-btn-secondary { border: 1.5px solid var(--bento-dv-indigo-40); background: transparent; color: var(--bento-dv-indigo-40); }
  </style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; border-radius: 24px; overflow: hidden; background: var(--bento-bg-secondary); display: flex; flex-direction: column; padding: 80px; gap: 40px; font-family: var(--font-bento-font-ui); position: relative; z-index: 0;">

  <svg viewBox="0 0 1280 800" preserveAspectRatio="none" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none;">
    <path d="M 1020,0 C 1070,56 1100,175 1100,250 C 1100,415 1010,635 1000,800 L 1284,804 L 1284,-4 Z" style="fill: var(--bento-dv-indigo-5);"></path>
  </svg>

  <div style="position: absolute; top: 50%; right: 0; transform: translateY(-50%); display: flex; flex-direction: column; align-items: stretch; gap: 4px; background: var(--bento-bg-primary); border: 1px solid var(--bento-neutral-5); border-right: none; border-top-left-radius: 16px; border-bottom-left-radius: 16px; box-shadow: -4px 0px 8px rgba(0, 0, 0, 0.16); padding: 8px;">
    <button type="button" aria-label="{{toggleLabel}}" onClick="{{toggleExpand}}" style="appearance: none; -webkit-appearance: none; position: absolute; top: 50%; left: -20px; transform: translateY(-50%); width: 20px; height: 56px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; background: var(--bento-bg-primary); border: 1px solid var(--bento-neutral-5); border-right: none; border-radius: 999px 0 0 999px; box-shadow: -2px 0px 4px rgba(0, 0, 0, 0.12); color: var(--bento-icon-secondary); cursor: pointer;">
      <x-import component-from-global-scope="BentoDS27_65ebe9.Icon" name="{{chevronName}}" size="16"></x-import>
    </button>
    <button type="button" class="nav-item" style="color: var(--bento-informative-30); background-color: var(--bento-dv-indigo-5)">
      <span style="display: inline-flex; color: var(--bento-dv-indigo-30);">
        <x-import component-from-global-scope="BentoDS27_65ebe9.Icon" name="Home" size="24"></x-import>
      </span>
      <sc-if value="{{expanded}}" hint-placeholder-val="{{true}}"><span style="color: var(--bento-dv-indigo-30)">主頁</span></sc-if>
    </button>
    <button type="button" class="nav-item" style="color: var(--bento-content-secondary);">
      <span class="material-symbol" aria-hidden="true">book_2</span>
      <sc-if value="{{expanded}}" hint-placeholder-val="{{true}}"><span>台詞本</span></sc-if>
    </button>
    <button type="button" class="nav-item" style="color: var(--bento-content-secondary);">
      <x-import component-from-global-scope="BentoDS27_65ebe9.Icon" name="GearWeightRegular" size="24"></x-import>
      <sc-if value="{{expanded}}" hint-placeholder-val="{{true}}"><span>設定</span></sc-if>
    </button>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 0;">
    <div style="width: 640px; max-width: 100%; box-sizing: border-box; background: var(--bento-bg-primary); border-radius: 24px; padding: 80px 56px; display: flex; flex-direction: column; align-items: center; gap: 40px; box-shadow: var(--bento-elevation-md)">
      <div style="box-sizing: border-box; display: flex; flex-direction: column; gap: 32px; justify-content: normal; align-items: center">
        <div class="complete-fade-icon" style="width: 160px; height: 160px; box-sizing: border-box; border-radius: 50%; border: 5px solid var(--bento-dv-indigo-40); background: var(--bento-bg-secondary); display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden;">
          <span style="color: var(--bento-dv-indigo-40); position: relative; z-index: 1; display: inline-flex;">
            <span class="material-symbol-lg" aria-hidden="true">content_cut</span>
          </span>
          <span class="importing-streak-track" aria-hidden="true"><span class="importing-streak-bar"></span></span>
        </div>
        <div class="complete-fade-text" style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
          <div style="font-family: var(--font-bento-font-heading); font-weight: 600; font-size: 28px; line-height: 44px; color: var(--bento-content-primary)">切割影片中</div>
          <div style="font-family: var(--font-bento-font-ui); font-weight: 400; font-size: 14px; line-height: 20px; color: var(--bento-content-secondary);">正在依字幕時間切分影片</div>
        </div>
      </div>

      <div class="complete-fade-actions">
        <button type="button" class="complete-btn complete-btn-secondary complete-btn-icon" onClick="{{handleCancel}}"><span class="material-symbol" aria-hidden="true">close</span>取消</button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { expanded: true };
  }

  toggleExpand = () => {
    this.setState({ expanded: !this.state.expanded });
  };

  handleCancel = () => {
    // TODO: 取消匯入流程
  };

  renderVals() {
    const expanded = this.state.expanded ?? true;
    return {
      expanded,
      toggleExpand: this.toggleExpand,
      chevronName: expanded ? 'ChevronRight' : 'ChevronLeft',
      toggleLabel: expanded ? '收合選單' : '展開選單',
      handleCancel: this.handleCancel,
    };
  }
}
</script>
</body>
</html>
